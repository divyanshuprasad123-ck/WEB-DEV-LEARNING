<!-- keep the nav bar sticky, the orange circle always in right bottom and the whole page content should not come in 1 page but such that a scroll bar appears -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>myex5</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        border: 2px solid black;
      }

      nav {
        background-color: pink;
        height: 30px;
        margin: 0px 1px 0px 1px;
      }
      ul {
        background-color: green;
        height: 200px;
        margin: 5px 10px;
        padding: 20px 30px;

        box-sizing: border-box;
        display: flex;
        justify-content: center;
      }

      .sec1 ul .li1 {
        list-style: none;
        background-color: pink;
        height: 150px;
        width: 150px;
      }

      .sec1 ul .li2 {
        list-style: none;
        background-color: blue;
        height: 150px;
        width: 150px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <nav></nav>
      </header>
      <section class="sec1">
        <ul>
          <li class="li1"></li>
          <li class="li2"></li>
        </ul>
      </section>
      <div>Welcome to this Sigma Web Development Express</div>
    </div>
  </body>
</html>

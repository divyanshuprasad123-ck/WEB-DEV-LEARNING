<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>replicating harry</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap");
    </style>
    <style>
      body {
        background-color: var(--seccol);
      }
      * {
        margin: 0;
        padding: 0;
      }
      :root {
        --primarycol: #061872cc;
        --seccol: #6ea5fccc;
        --textcol: white;
      }

      nav ul {
        display: flex;
        background-color: var(--primarycol);
        gap: 15px;
      }
      nav ul li {
        list-style: none;
        padding: 5px;
        font-weight: bold;
        font-family: "Poppins", sans-serif;
        color: var(--textcol);
        padding: 15px;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li>Home</li>
          <li>About</li>
          <li>Services</li>
          <li>Contact Us</li>
        </ul>
      </nav>
    </header>
  </body>
</html>

<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Exercise 8</title>

    <style>
      .container {
        background-color: blue;

        height: 80vh;

        width: 80vw;

        display: flex;

        align-items: flex-end;
      }

      .box {
        background-color: red;

        height: 80px;

        width: 80px;

        border-radius: 70px;

        animation: bouncing_ball 8s linear infinite;
      }

      @keyframes bouncing_ball {
        0% {
          transform: translate(0, 0);
        }

        12.5% {
          transform: translate(0, 0);
        }

        25% {
          transform: translate(0, 0);
        }

        37.5% {
          transform: translate(0, 0);
        }

        50% {
          transform: translate(0, 0);
        }

        62.5% {
          transform: translate(0, 0);
        }

        75% {
          transform: translate(0, 0);
        }

        87.5% {
          transform: translate(0, 0);
        }

        100% {
          transform: translate(0, 0);
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="box"></div>
    </div>
  </body>
</html>

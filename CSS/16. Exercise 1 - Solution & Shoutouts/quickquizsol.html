<!-- Quick Quiz  -->
<!-- Create a website which shows videos of different category and audios of different categories.
    You can use YouTube videos in an iframe using YouTube's embedding feature -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>video audio quick quiz</title>
  </head>
  <body>
    <div>
      <video src="1.mp4" height="255" controls></video>
    </div>
    <div>
      <video src="2.mp4" height="255" controls></video>
    </div>
    <div>
      <audio src="1.mp3" controls></audio>
    </div>
    <div>
      <audio src="2.mp3" controls></audio>
    </div>
    <div>
      <iframe
        width="560"
        height="315"
        src="https://www.youtube.com/embed/pi0bAxOGHIo?si=hk4AEnrCaARvecNR"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen
      ></iframe>
    </div>
  </body>
</html>

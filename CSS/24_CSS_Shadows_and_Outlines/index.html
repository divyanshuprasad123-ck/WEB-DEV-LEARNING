<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        border: 2px solid black;
        padding: 34px;
        box-shadow: 5px 15px 5px rgb(170, 132, 132);
        /* box-shadow: h-offset v-offset blur spread color inset; */
      }
      .text-element {
        text-shadow: 2px 4px 6px rgb(198, 11, 236);
        outline: 2px solid black;
        border: 2px solid green;
        outline-offset: 10px;
        outline-width: 8px;
        border-radius: 34px;
      }
    </style>
  </head>
  <body>
    <div class="box">I am a box</div>
    <p class="text-element">
      Lorem ipsum dolor, sit amet consectetur adipisicing elit. Aspernatur
      reprehenderit labore dignissimos laboriosam ducimus exercitationem quas
      rerum, obcaecati voluptate ex eos aliquid, aut at quia fugiat nisi modi
      vel corporis consequatur necessitatibus earum ea.
    </p>
  </body>
</html>

<!-- Quick Quiz:
    Without using br tag, write a vertically aligned form asking for name, city and pincode of a user.
    Everyone must comment -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      a vertically aligned form asking for name, city and pincode of a user
    </title>
  </head>
  <body>
    <h1>
      a vertically aligned form asking for name, city and pincode of a user
    </h1>
    <form action="post">
      <div>
        <label for="name">Enter your Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="Enter your name"
        />
      </div>
      <div>
        <label for="city">Enter your City</label>
        <input
          type="text"
          id="city"
          name="city"
          placeholder="Enter your city"
        />
      </div>
      <div>
        <label for="pincode">Enter your Pincode</label>
        <input
          type="text"
          id="pincode"
          name="pincode"
          placeholder="Enter your pincode"
        />
      </div>
      <div>
        <button type="submit">Submit Details</button>
      </div>
    </form>
  </body>
</html>

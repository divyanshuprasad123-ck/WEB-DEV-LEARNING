<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forms - Lets learn it</title>
  </head>

  <body>
    <h1>Form to apply for Sigma Web Development course - TA</h1>
    <form action="post">
      <div>
        <label for="username">Enter your Username</label>
        <input
          type="text"
          id="username"
          name="username"
          placeholder="Enter your username"
          autofocus
        />
      </div>
      <div>
        <label for="city">Enter your city</label>
        <input
          type="text"
          id="city"
          name="city"
          placeholder="Enter your city"
        />
      </div>
      <div>
        <input type="radio" id="male" name="gender" value="male" />
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" value="female" />
        <label for="female">Female</label>
      </div>

      <div>
        <input type="radio" value="Human" id="Human" name="species" />
        <label for="Human">Human</label>
        <input type="radio" value="Alien" id="Alien" name="species" />
        <label for="Alien">Alien</label>
      </div>

      <div>
        <input type="checkbox" id="subscribe" name="subscribe" value="yes" />
        <label for="subscribe">Subscribe to newsletter</label>
      </div>
      <div>
        <input
          type="checkbox"
          id="truedetectivefan"
          value="yes"
          name="truedetectivefan"
        />
        <label for="truedetectivefan">True Detective Fan?</label>
      </div>
      <div>
        <label for="comment">Enter your comment</label>
        <br />
        <textarea id="comment" name="comment" rows="4" cols="50"></textarea>
      </div>
      <div>
        <label for="thoughts">Enter your thoughts</label>
        <br />
        <textarea name="thoughts" id="thoughts" rows="4" cols="50"></textarea>
      </div>

      <div>
        <select name="fruits">
          <option value="apple">Apple</option>
          <option value="banana">Banana</option>
          <option value="cherry">Cherry</option>
        </select>
      </div>
      <div>
        <select name="skill">
          <option value="webdev">Web Dev</option>
          <option value="gd">graphic design</option>
          <option value="copywriting">Copywriting</option>
        </select>
      </div>
    </form>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <video
      src="video.mp4"
      height="255"
      controls
      loop
      muted
      poster="download.jpg"
    ></video>

    <div>
      <audio src="sachin.mp3" controls autoplay loop muted></audio>
    </div>

    <svg height="100" width="100">
      <circle
        cx="50"
        cy="50"
        r="40"
        stroke="black"
        stroke-width="4"
        fill="red"
      />
    </svg>
    <img src="img.svg" alt="My Svg Image" />

    <!-- <iframe src="https://www.codewithharry.com/tutorial/html-iframes/" width="322" height="444"></iframe> -->

    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/tVzUXW6siu0?si=7J84nlTGC3xj8V5F"
      title="YouTube video player"
      frameborder="0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <video
      src="Rick Rolled (Short Version) - Legacy PNDA (360p, h264).mp4"
      controls
      height="500"
      poster="bitmesracivil.jpg"
    ></video>

    <!-- Quick Quiz  -->
    <!-- Create a website which shows videos of different category and audios of different categories.
    You can use YouTube videos in an iframe using YouTube's embedding feature -->
  </body>
</html>
